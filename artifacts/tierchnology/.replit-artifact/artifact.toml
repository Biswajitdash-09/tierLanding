kind = "web"
previewPath = "/"
title = "TierChnology"
description = "A responsive company landing page introducing TierChnology and its portfolio of learning, payroll, payments, banking, and AI finance products."
version = "1.0.0"
id = "artifacts/tierchnology"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25795

[services.development]
run = "pnpm --filter @workspace/tierchnology run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tierchnology", "run", "build" ]
serve = "static"
publicDir = "artifacts/tierchnology/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25795"
BASE_PATH = "/"
